[package]
name = "auria-license"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/auria-core/auria-runtime"
authors = ["AURIA Team <auria@dust.llc>"]
description = "AURIA Runtime Core - License verification"

[dependencies]
auria-core = { path = "../auria-core", version = "0.1.0"}
auria-security = { path = "../auria-security", version = "0.1.0"}
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
sha3 = "0.10"
ed25519-dalek = "2.1"

[dev-dependencies]
rand = "0.8"
